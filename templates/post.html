<!doctype html>
<html lang="he" dir="rtl" data-theme="deep-water">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0f2a">
    <meta name="description" content="{{TITLE}}">
    <link rel="canonical" href="https://me.thedigitalreality.app/posts/{{ID}}/">
    <title>{{TITLE}} — יאיר אהרון כהן</title>
    <link rel="icon" href="../../assets/images/profile.webp">
    <link rel="stylesheet" href="../../themes.css?v=20260923-flat-posts">
    <link rel="stylesheet" href="../../styles.css?v=20260923-flat-posts">
  </head>
  <body>
    <main class="site-shell">

      <header class="library-header post-page-header">
        <a class="library-home" href="../../">יאיר אהרון כהן</a>
        <h1 lang="he" dir="rtl">{{TITLE}}</h1>
        <a class="library-back" href="../../#posts">← כל המאמרים</a>
        <div class="post-meta"><span class="post-category">{{CATEGORY}}</span><time datetime="{{DATE}}">{{DATE}}</time></div>
        <img class="post-featured-image" src="./media/featured.webp" alt="">
      </header>
      <div class="content-shell library-content">
        <article class="post-content" lang="he" dir="rtl">
{{CONTENT}}
        </article>
        <p class="post-source"><a href="{{SOURCE_URL}}" target="_blank" rel="noopener noreferrer">לצפייה במקור</a></p>
        <footer><p>לנשום · להרגיש · לצמוח</p></footer>
      </div>
    </main>
  </body>
</html>
