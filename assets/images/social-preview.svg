<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#300060"/>
      <stop offset="0.52" stop-color="#6a00a8"/>
      <stop offset="1" stop-color="#b300b3"/>
    </linearGradient>
    <linearGradient id="imageFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020064"/>
      <stop offset="0.42" stop-color="#020064" stop-opacity="0.84"/>
      <stop offset="0.72" stop-color="#020064" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#020064" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="imageShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050533" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#020064" stop-opacity="0.66"/>
    </linearGradient>
    <clipPath id="panelClip">
      <rect x="70" y="45" width="1060" height="540" rx="38"/>
    </clipPath>
    <filter id="panelShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#18002f" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#outer)"/>
  <circle cx="90" cy="80" r="180" fill="#ffffff" fill-opacity="0.06"/>
  <circle cx="1110" cy="570" r="210" fill="#ffffff" fill-opacity="0.05"/>

  <rect x="70" y="45" width="1060" height="540" rx="38" fill="#020064" filter="url(#panelShadow)"/>
  <g clip-path="url(#panelClip)">
    <image href="content/hero.webp" x="560" y="45" width="570" height="540" preserveAspectRatio="xMaxYMid slice"/>
    <rect x="70" y="45" width="1060" height="540" fill="url(#imageShade)"/>
    <rect x="70" y="45" width="1060" height="540" fill="url(#imageFade)"/>
  </g>
  <rect x="70.5" y="45.5" width="1059" height="539" rx="37.5" fill="none" stroke="#dcd3ff" stroke-opacity="0.18"/>

  <g text-anchor="end" font-family="Arial, sans-serif">
    <text x="555" y="205" fill="#a185da" font-size="22" font-weight="700" letter-spacing="2">מים · נשימה · תודעה</text>
    <text x="555" y="290" fill="#ffffff" font-size="66" font-weight="700">יאיר אהרון כהן</text>
    <text x="555" y="350" fill="#dcd3ff" font-size="28">קורסים, סדנאות ותהליכי צמיחה</text>
    <text x="555" y="482" fill="#c9b8f3" font-size="21" font-weight="600">aharonyaircohen.github.io/me</text>
  </g>
  <rect x="155" y="432" width="400" height="3" rx="2" fill="#a185da" fill-opacity="0.58"/>
</svg>
